<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Planner</title>
<style>
:root{--fg:#f2efe9;--mute:#8d8a84;--line:#24231f;--panel:#0e0e0d;font-family:'Playfair Display',Georgia,'Noto Serif',serif}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--fg)}
body{font-size:17px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
main{max-width:640px;margin:0 auto;padding:18px 16px}
h1{font-size:30px;font-weight:600;margin:6px 0 14px;letter-spacing:-.01em}h2{font-size:19px;font-weight:600;margin:26px 0 8px}
small,.m{color:var(--mute);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#000;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:15px;padding:15px 0}nav button.on{color:var(--fg);box-shadow:inset 0 2px 0 var(--fg)}
button{font:inherit;color:var(--fg)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #9ec9e2;outline-offset:2px}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row>div{flex:1;min-width:0}.row b{font-weight:600;display:block;overflow-wrap:anywhere}
.row.done b{text-decoration:line-through;color:var(--mute)}.dot{width:10px;height:10px;border-radius:50%;flex:none}
.ic{background:none;border:1px solid var(--line);border-radius:8px;min-width:44px;min-height:44px;color:var(--mute)}
.btn{background:var(--fg);color:#000;border:0;border-radius:10px;padding:12px 18px;font-weight:600}.btn.g{background:none;color:var(--fg);border:1px solid var(--line)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}.bar div{display:flex;gap:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.grid .h{color:var(--mute);font-size:13px;padding:4px 0}
.d{background:none;border:0;border-radius:10px;aspect-ratio:1/.95;padding:4px 0;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:3px}
.d.t{box-shadow:inset 0 0 0 1px var(--mute)}.d.s{background:var(--fg);color:#000}.d.o{opacity:.3}.dots{display:flex;gap:2px;height:6px}.dots i{width:5px;height:5px;border-radius:50%}
.sm .d{aspect-ratio:1/.8;font-size:13px}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--fg);color:#000;border:0;font-size:30px;line-height:1}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:16px;width:min(560px,94vw);padding:18px}dialog::backdrop{background:#000c}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:14px}input,select,textarea{width:100%;background:#000;color:var(--fg);border:1px solid #3a3935;border-radius:10px;padding:11px;font:inherit}
.wd{display:flex;gap:6px}.wd label{margin:0;flex:1;text-align:center;border:1px solid #3a3935;border-radius:8px;padding:8px 0;color:var(--fg)}.wd input{display:none}.wd label:has(input:checked){background:var(--fg);color:#000}
.empty{color:var(--mute);padding:10px 0}
</style></head><body><main id="v"></main><button class="fab" id="fab" aria-label="Add">+</button>
<nav><button data-v="home">Home</button><button data-v="dead">Deadlines</button><button data-v="rem">Reminders</button><button data-v="cal">Calendar</button></nav>
<dialog id="dlg"><form method="dialog" id="f"><h2 style="margin-top:0">Add to planner</h2>
<label>Type</label><select id="ty"></select><label>Title</label><input id="ti" required><label id="dl">Date</label><input id="da" type="date" required>
<div id="tm" style="display:flex;gap:8px"><div style="flex:1"><label>Start time</label><input id="t1" type="time"></div><div style="flex:1"><label>End time</label><input id="t2" type="time"></div></div>
<div id="wk" hidden><label>Repeats weekly on</label><div class="wd"></div><label>Until (optional)</label><input id="un" type="date"></div>
<label>Notes</label><textarea id="no" rows="2"></textarea>
<div class="bar" style="margin-top:16px"><button type="button" class="btn g" id="cx">Cancel</button><button class="btn" id="sv">Save</button></div></form></dialog>
<script>
const T={assignment:['Assignment','#e8a0a8'],deadline:['Other deadline','#f0c987'],reminder:['Reminder','#9ec9e2'],event:['Event','#b5d99c'],birthday:['Birthday','#d6a5e8'],work:['Work','#e9e6df'],class:['Class','#f09e7a'],holiday:['Holiday','#7fd1c0']};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
let S;try{S=JSON.parse(localStorage.getItem('planner.v1'))||{items:[]}}catch(e){S={items:[]}}
const save=()=>{try{localStorage.setItem('planner.v1',JSON.stringify(S))}catch(e){}};
let view='home',mode='month',cur=new Date(),sel=ds(new Date()),filt='all';
const nth=(y,m,w,n)=>{let d=new Date(y,m,1);while(d.getDay()!=w)d.setDate(d.getDate()+1);d.setDate(d.getDate()+7*(n-1));return d},last=(y,m,w)=>{let d=new Date(y,m+1,0);while(d.getDay()!=w)d.setDate(d.getDate()-1);return d};
function hol(y){return[[new Date(y,0,1),"New Year's Day"],[nth(y,0,1,3),'Martin Luther King Jr. Day'],[nth(y,1,1,3),"Presidents' Day"],[last(y,4,1),'Memorial Day'],[new Date(y,5,19),'Juneteenth'],[new Date(y,6,4),'Independence Day'],[nth(y,8,1,1),'Labor Day'],[nth(y,9,1,2),'Columbus Day'],[new Date(y,10,11),'Veterans Day'],[nth(y,10,4,4),'Thanksgiving'],[new Date(y,11,25),'Christmas Day']].map(([d,t])=>({type:'holiday',title:t,date:ds(d),ro:1}))}
function on(d){const dt=pd(d),o=[];S.items.forEach(i=>{let h=i.date===d;if(!h&&i.repeat==='yearly'){const a=pd(i.date);h=a.getMonth()==dt.getMonth()&&a.getDate()==dt.getDate()&&d>=i.date}
if(!h&&i.repeat==='weekly')h=(i.days||[]).includes(dt.getDay())&&d>=i.date&&(!i.until||d<=i.until);if(h)o.push(i)});hol(dt.getFullYear()).forEach(h=>{if(h.date===d)o.push(h)});return o.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}
function next(n,fn){const r=[];let d=new Date();for(let k=0;k<n;k++){const s=ds(d);on(s).forEach(i=>{if(!fn||fn(i))r.push([s,i])});d.setDate(d.getDate()+1)}return r}
const nice=s=>{const d=pd(s),t=ds(new Date()),tm=new Date();tm.setDate(tm.getDate()+1);return(s===t?'Today':s===ds(tm)?'Tomorrow':DN[d.getDay()]+', '+MN[d.getMonth()].slice(0,3)+' '+d.getDate())};
const tf=i=>i.time?(i.endTime?i.time+'–'+i.endTime:i.time):'';
function row(i,s,ctl){const c=T[i.type][1],ix=S.items.indexOf(i),x=(i.type==='assignment'||i.type==='deadline'||i.type==='reminder')&&i.repeat!=='weekly';
return`<div class="row ${i.done?'done':''}"><span class="dot" style="background:${c}"></span><div><b>${esc(i.title)}</b><small>${[s?nice(s):'',tf(i),T[i.type][0],i.notes?esc(i.notes):''].filter(Boolean).join(' · ')}</small></div>${ctl&&ix>=0?`${x?`<button class="ic" data-a="done" data-i="${ix}" aria-label="Mark done">${i.done?'↺':'✓'}</button>`:''}<button class="ic" data-a="del" data-i="${ix}" aria-label="Delete">✕</button>`:''}</div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list=(a,ctl,empty)=>a.length?a.map(([s,i])=>row(i,s,ctl)).join(''):`<div class="empty">${empty}</div>`;
function grid(small){const y=cur.getFullYear(),m=cur.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=ds(new Date());let h=DN.map(d=>`<div class="h">${d[0]}</div>`).join('');
for(let k=0;k<f;k++)h+='<div></div>';for(let d=1;d<=n;d++){const s=y+'-'+pad(m+1)+'-'+pad(d),ty=[...new Set(on(s).map(i=>i.type))].slice(0,4);h+=`<button class="d ${s===t?'t':''} ${s===sel&&!small?'s':''}" data-a="day" data-s="${s}">${d}<span class="dots">${ty.map(k=>`<i style="background:${T[k][1]}"></i>`).join('')}</span></button>`}
return`<div class="bar"><h2 style="margin:0">${MN[m]} ${y}</h2><div><button class="ic" data-a="pm">‹</button><button class="ic" data-a="nm">›</button></div></div><div class="grid ${small?'sm':''}">${h}</div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));let h='';
if(view==='home'){const wk=next(7,i=>i.type!=='holiday'&&i.type!=='work'&&i.type!=='class'&&!i.done);
h=`<h1>Today is ${nice(ds(new Date())).replace('Today',DN[new Date().getDay()]+', '+MN[new Date().getMonth()]+' '+new Date().getDate())}</h1>${grid(1)}<h2>This week</h2>${list(wk,0,'Nothing scheduled this week.')}
<h2>Upcoming deadlines</h2>${list(next(60,i=>(i.type==='assignment'||i.type==='deadline')&&!i.done).slice(0,5),0,'No deadlines coming up.')}
<h2>Holidays coming up</h2>${list(next(200,i=>i.type==='holiday').slice(0,3),0,'')}<h2>When I work</h2>${list(next(30,i=>i.type==='work').slice(0,4),0,'No work days added yet. Use + and pick Work.')}
<h2>Backup</h2><div class="bar"><button class="btn g" data-a="exp">Export data</button><button class="btn g" data-a="imp">Import data</button></div><small class="m">Your data is saved on this device. Export a backup now and then.</small>`}
if(view==='dead'){const a=S.items.filter(i=>(i.type==='assignment'||i.type==='deadline')&&(filt==='all'||i.type===filt)).sort((a,b)=>a.date.localeCompare(b.date)).map(i=>[i.date,i]);
h=`<h1>Deadlines</h1><div class="bar"><select id="fl" style="max-width:220px"><option value="all">Everything</option><option value="assignment">Assignments</option><option value="deadline">Other deadlines</option></select></div>${list(a,1,'No deadlines yet. Tap + to add one.')}`}
if(view==='rem'){const a=S.items.filter(i=>i.type==='reminder').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).map(i=>[i.date,i]);h=`<h1>Reminders</h1>${list(a,1,'No reminders yet. Tap + to add one.')}`}
if(view==='cal'){h=`<h1>Calendar</h1><div class="bar"><div><button class="btn ${mode==='month'?'':'g'}" data-a="m" data-m="month">Month</button><button class="btn ${mode==='list'?'':'g'}" data-a="m" data-m="list">List</button></div></div>`;
h+=mode==='month'?grid(0)+`<h2>${nice(sel)}</h2>${list(on(sel).map(i=>[sel,i]),1,'Nothing on this day.')}`:list(next(60),1,'Nothing coming up.')}
$('#v').innerHTML=h;const fl=$('#fl');if(fl){fl.value=filt;fl.onchange=()=>{filt=fl.value;render()}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-v]');if(!b)return;if(b.dataset.v){view=b.dataset.v;scrollTo(0,0);return render()}
const a=b.dataset.a,i=+b.dataset.i;if(a==='done')S.items[i].done=!S.items[i].done;else if(a==='del'){if(!confirm('Delete this?'))return;S.items.splice(i,1)}
else if(a==='day')sel=b.dataset.s;else if(a==='pm')cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);else if(a==='nm')cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);else if(a==='m')mode=b.dataset.m;
else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='planner-backup.json';l.click();return}
else if(a==='imp'){const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=()=>f.files[0].text().then(t=>{try{const d=JSON.parse(t);if(Array.isArray(d.items)){S=d;save();render()}}catch(x){alert('That file could not be read.')}});f.click();return}
save();render()});
const ty=$('#ty'),wd=$('.wd');ty.innerHTML=Object.keys(T).filter(k=>k!=='holiday').map(k=>`<option value="${k}">${T[k][0]}</option>`).join('');wd.innerHTML=DN.map((d,k)=>`<label><input type="checkbox" value="${k}">${d}</label>`).join('');
function sync(){const t=ty.value,w=t==='work'||t==='class';$('#wk').hidden=!w;$('#tm').style.display=t==='assignment'||t==='deadline'||t==='reminder'||w||t==='event'?'flex':'none';$('#dl').textContent=w?'Starts on':t==='birthday'?'Birthday date':'Date'}
ty.onchange=sync;
function openF(){const t={dead:'assignment',rem:'reminder',cal:'event',home:'assignment'}[view];ty.value=t;$('#f').reset();ty.value=t;$('#da').value=view==='cal'?sel:ds(new Date());sync();$('#dlg').showModal()}
$('#fab').onclick=openF;$('#cx').onclick=()=>$('#dlg').close();
$('#f').onsubmit=()=>{const t=ty.value,w=t==='work'||t==='class',i={type:t,title:$('#ti').value.trim(),date:$('#da').value,notes:$('#no').value.trim()};if(!i.title||!i.date)return;
if($('#t1').value)i.time=$('#t1').value;if($('#t2').value)i.endTime=$('#t2').value;if(t==='birthday')i.repeat='yearly';
if(w){const d=[...wd.querySelectorAll('input:checked')].map(x=>+x.value);if(d.length){i.repeat='weekly';i.days=d;if($('#un').value)i.until=$('#un').value}}
S.items.push(i);save();render()};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
