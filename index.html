<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Planner</title>
<style>

button,[data-a],[data-v],select,input[type=file],.wd label,.d{cursor:pointer}.btn:hover{filter:brightness(1.1)}.ic:hover,.tb button:hover{border-color:var(--ac);color:var(--fg)}nav button:hover{color:var(--fg)}.d:not(.s):hover{background:var(--panel)}
.tl{position:relative;margin:16px 0 8px}.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}.hr span{position:absolute;left:0;top:-9px;width:54px;font-size:12px;color:var(--mute);background:var(--bg)}

.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--mute);background:none;flex:none;color:var(--on);font-size:15px;line-height:1;padding:0;cursor:pointer}.ck.on{background:var(--ac)}
.ic.arm,.btn.arm{background:#b3363f;color:#fff;border-color:#b3363f;font-size:13px}.bar input{flex:1}

</style></head><body><main id="v"></main><div id="layer"></div><button class="fab" id="fab" aria-label="Add">+</button><button class="fab sf" id="sfab" aria-label="Add sticky note">✎</button><input type="file" accept="image/*" id="pf" hidden>

<dialog id="dlg"><form method="dialog" id="f"><h2 style="margin-top:0" id="dh">Add to planner</h2>

<script>
const T={assignment:['Assignment','#e8a0a8'],deadline:['Other deadline','#f0c987'],reminder:['Reminder','#9ec9e2'],event:['Event','#b5d99c'],birthday:['Birthday','#d6a5e8'],work:['Work','#e9e6df'],class:['Class','#f09e7a'],holiday:['Holiday','#7fd1c0']};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};

let nid=null,view='home',mode='month',cur=new Date(),sel=ds(new Date()),filt='all';
const nth=(y,m,w,n)=>{let d=new Date(y,m,1);while(d.getDay()!=w)d.setDate(d.getDate()+1);d.setDate(d.getDate()+7*(n-1));return d},last=(y,m,w)=>{let d=new Date(y,m+1,0);while(d.getDay()!=w)d.setDate(d.getDate()-1);return d};

const tf=i=>i.time?(i.endTime?i.time+'–'+i.endTime:i.time):'';

function grid(small){const y=cur.getFullYear(),m=cur.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=ds(new Date());let h=DN.map(d=>`<div class="h">${d[0]}</div>`).join('');
for(let k=0;k<f;k++)h+='<div></div>';for(let d=1;d<=n;d++){const s=y+'-'+pad(m+1)+'-'+pad(d),ty=[...new Set(on(s).map(i=>i.type))].slice(0,4);h+=`<button class="d ${s===t?'t':''} ${s===sel&&!small?'s':''}" data-a="day" data-s="${s}">${d}<span class="dots">${ty.map(k=>`<i style="background:${T[k][1]}"></i>`).join('')}</span></button>`}

const DNF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],ord=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th'),H=t=>`<div class="hd"><h1>${t}</h1></div>`,PN={home:'Home',rem:'Reminders',dead:'Deadlines',cal:'Calendar',note:'Notes',set:'Settings'};

function ns(){const n=cn(),e=$('#ed');if(!n||!e)return;n.html=e.innerHTML;n.title=$('#nt').value;if(nk==='shared'){n.updated_at=new Date().toISOString();n.updated_by=AU?AU.email:'';clearTimeout(snt);snt=setTimeout(()=>sb('/rest/v1/shared_notes?id=eq.'+n.id,{method:'PATCH',body:JSON.stringify({title:n.title,html:n.html,updated_by:n.updated_by,updated_at:n.updated_at})}).catch(()=>{}),1200)}else{n.updated=Date.now();save()}}
function noteView(){const n=cn(),ar='n'+(n&&n.id);

async function migrate(){if(!AU){mst='Sign in first.';render();return}let n=0;try{for(const nt of S.notes){if(!(nt.html||'').includes('src="data:'))continue;const d=document.createElement('div');d.innerHTML=nt.html;for(const im of d.querySelectorAll('img')){const s=im.getAttribute('src')||'';if(!s.startsWith('data:'))continue;const b=await(await fetch(s)).blob(),p=AU.uid+'/'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+n)+(b.type==='image/png'?'.png':'.jpg');await sb('/storage/v1/object/pics/'+p,{method:'POST',headers:{'Content-Type':b.type},body:b});im.setAttribute('data-p',p);im.removeAttribute('src');n++}nt.html=d.innerHTML;nt.updated=Date.now();save()}mst='Done. Moved '+n+' picture'+(n===1?'':'s')+'.'}catch(e){mst='Stopped after '+n+'. '+e.message}render()}
const stor=()=>{const kb=Math.round(JSON.stringify(S).length/1024),np=S.notes.reduce((a,x)=>a+((x.html||'').match(/src="data:/g)||[]).length,0);return`<h2>Storage</h2><small class="m">This device is using about ${kb} KB of roughly 5,000 KB. ${np} picture${np===1?'':'s'} still stored on this device.${mst?' '+esc(mst):''}</small>${np&&AU?'<div class="bar" style="justify-content:flex-start;margin-top:8px"><button class="btn" data-a="mp">Move pictures to cloud storage</button></div>':''}<small class="m" style="display:block;margin-top:6px">New pictures are saved to cloud storage automatically while you are signed in.</small>`};
async function loadShared(){try{SN=await sb('/rest/v1/shared_notes?select=id,title,html,pin,updated_by,updated_at&order=updated_at.desc')||[];sErr=''}catch(e){sErr='Could not load shared notes. Has the shared setup SQL been run, and is your account added to it?'}if(view==='note'&&!nid)render()}
const chatHtml=()=>CH.length?CH.map(m=>`<div class="msg ${AU&&m.email===AU.email?'me':''}"><small>${esc(nm(m.email))} · ${new Date(m.created_at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</small>${esc(m.body)}</div>`).join(''):'<div class="empty">No messages yet. Say hi.</div>';
async function chatLoad(){const c=()=>$('#cl');try{const x=await sb('/rest/v1/chat?select=id,email,body,created_at&order=created_at.desc&limit=60');CH=(x||[]).reverse();if(c()){c().innerHTML=chatHtml();c().scrollTop=c().scrollHeight}}catch(e){if(c()&&!CH.length)c().innerHTML='<div class="empty">Could not load chat. Has the shared setup SQL been run, and is your account added to it?</div>'}}
async function chatSend(){const i=$('#cm'),b=i&&i.value.trim();if(!b||!AU)return;i.value='';try{await sb('/rest/v1/chat',{method:'POST',body:JSON.stringify({body:b,email:AU.email})})}catch(e){i.value=b}chatLoad()}
setInterval(()=>{if(AU&&view==='note'&&ntab==='chat'&&!document.hidden)chatLoad()},5000);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cm'){e.preventDefault();chatSend()}});
function wk(){const t=new Date(),m=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((t.getDay()+6)%7));let h='';for(let k=0;k<7;k++){const d=new Date(m.getFullYear(),m.getMonth(),m.getDate()+k),s=ds(d),ty=[...new Set(on(s).map(i=>i.type))].slice(0,4);h+=`<button class="d ${s===ds(t)?'t':''}" data-a="wday" data-s="${s}"><small>${DN[d.getDay()]}</small>${d.getDate()}<span class="dots">${ty.map(y=>`<i style="background:${T[y][1]}"></i>`).join('')}</span></button>`}return`<div class="grid wk">${h}</div>`}
function render(){$('#fab').style.display=view==='set'||view==='note'?'none':'';$('#sfab').style.display=view==='note'?'none':'';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='dead'?'rem':view)));let h='';
if(view==='home'){const wl=next(7,i=>i.type!=='holiday'&&i.type!=='work'&&i.type!=='class'&&!isDone(i));
h=`<div class="hd"><h1>Today is <span class="ac">${DNF[new Date().getDay()]}, ${MN[new Date().getMonth()]} ${ord(new Date().getDate())}</span></h1></div>${wk()}<h2>This week</h2>${list(wl,2,'Nothing scheduled this week.')}
<h2>Upcoming deadlines</h2>${list(next(60,i=>(i.type==='assignment'||i.type==='deadline')&&!isDone(i)).slice(0,5),2,'No deadlines coming up.')}
<h2>Holidays coming up</h2>${list(next(200,i=>i.type==='holiday').slice(0,3),0,'')}`}
if(view==='set'){h=`${H('Settings')}<h2>Appearance</h2><div class="bar" style="justify-content:flex-start"><button class="btn ${S.theme==='light'?'g':''}" data-a="th" data-m="dark">Dark</button><button class="btn ${S.theme==='light'?'':'g'}" data-a="th" data-m="light">Light</button></div>${acct()}${feeds()}${stor()}<h2>Work schedule</h2>${list(S.items.filter(i=>i.type==='work').map(i=>[i.repeat==='weekly'?'':i.date,i]),1,'No work days added yet.')}<div class="bar" style="margin-top:10px"><button class="btn" data-a="addwork">Add work schedule</button></div><small class="m">Weekly schedules repeat on the days you pick and also show on your calendar.</small><h2>Class schedule</h2>${list(S.items.filter(i=>i.type==='class').map(i=>[i.repeat==='weekly'?'':i.date,i]),1,'No classes added yet.')}<div class="bar" style="margin-top:10px"><button class="btn" data-a="addclass">Add class schedule</button></div><small class="m">Tap any item to edit it.</small><h2>Backup</h2><div class="bar"><button class="btn g" data-a="exp">Export data</button><button class="btn g" data-a="imp">Import data</button></div><small class="m">Everything is saved on this device. Export a backup file now and then, and import it to restore or move to another device.</small><small class="m" style="display:block;margin-top:14px">App version 9</small>`}
if(view==='dead'){const a=S.items.concat(FEED.filter(i=>i.date>=ds(new Date()))).filter(i=>(i.type==='assignment'||i.type==='deadline')&&(filt==='all'||(filt==='open'&&!isDone(i))||i.type===filt)).sort((a,b)=>a.date.localeCompare(b.date)).map(i=>[i.date,i]);
h=`${H('Deadlines')}${seg('dead')}<div class="bar"><select id="fl" style="max-width:220px"><option value="all">Everything</option><option value="assignment">Assignments</option><option value="deadline">Other deadlines</option><option value="open">Not done yet</option></select></div>${list(a,1,'No deadlines yet. Tap + to add one.')}`}
if(view==='rem'){const a=S.items.filter(i=>i.type==='reminder').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).map(i=>[i.date,i]);h=`${H('Reminders')}${seg('rem')}${list(a,1,'No reminders yet. Tap + to add one.')}`}
if(view==='cal'){h=`${H('Calendar')}<div class="bar"><div><button class="btn ${mode==='month'?'':'g'}" data-a="m" data-m="month">Month</button><button class="btn ${mode==='list'?'':'g'}" data-a="m" data-m="list">List</button></div></div>`;
h+=mode==='month'?grid(0)+`<small class="m">Tap a day to see it hour by hour.</small>`:mode==='day'?dayView():list(next(60),1,'Nothing coming up.')}
if(view==='note')h=noteView();$('#v').innerHTML=h;const fl=$('#fl');if(fl){fl.value=filt;fl.onchange=()=>{filt=fl.value;render()}}stk();hydrate()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-v]');if(!b)return;if(b.dataset.v){view=b.dataset.v;if(b.closest('nav'))nid=null;scrollTo(0,0);return render()}
const a=b.dataset.a,i=+b.dataset.i;if(NA(a,b))return;if(a==='done')S.items[i].done=!S.items[i].done;else if(a==='del'){const k='i'+i;if(armedK!==k){arm(k);return}armedK=null;S.items.splice(i,1)}
else if(a==='wday'){sel=b.dataset.s;cur=pd(sel);view='cal';mode='month'}else if(a==='addwork'){openF();return}else if(a==='day'){sel=b.dataset.s;mode='day'}else if(a==='dn'){const dd=pd(sel);dd.setDate(dd.getDate()+(+b.dataset.n));sel=ds(dd);cur=dd}else if(a==='pm')cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);else if(a==='nm')cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);else if(a==='m')mode=b.dataset.m;
else if(a==='exp'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='planner-backup.json';l.click();return}
else if(a==='imp'){const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=()=>f.files[0].text().then(t=>{try{const d=JSON.parse(t);if(Array.isArray(d.items)){S=d;S.notes=S.notes||[];S.stickies=S.stickies||[];S.fd=S.fd||{};save();theme();render()}}catch(x){alert('That file could not be read.')}});f.click();return}
save();render()});
const ty=$('#ty'),wd=$('.wd');ty.innerHTML=Object.keys(T).filter(k=>k!=='holiday').map(k=>`<option value="${k}">${T[k][0]}</option>`).join('');wd.innerHTML=DN.map((d,k)=>`<label><input type="checkbox" value="${k}">${d}</label>`).join('');
function sync(){const t=ty.value,w=t==='work'||t==='class';$('#wk').hidden=!w;$('#ti').required=!w;$('#tll').textContent=w?'Title (optional)':'Title';$('#tm').style.display=t==='assignment'||t==='deadline'||t==='reminder'||w||t==='event'?'flex':'none';$('#dl').textContent=w?'Starts on':t==='birthday'?'Birthday date':'Date'}
ty.onchange=sync;
function openF(t,idx){eid=idx==null?null:idx;const it=eid==null?null:S.items[eid];$('#f').reset();ty.value=it?it.type:(t||{dead:'assignment',rem:'reminder',cal:'event',home:'assignment',set:'work'}[view]||'event');$('#dh').textContent=it?'Edit':'Add to planner';
if(it){$('#ti').value=it.title||'';$('#da').value=it.date;$('#t1').value=it.time||'';$('#t2').value=it.endTime||'';$('#no').value=it.notes||'';$('#un').value=it.until||'';wd.querySelectorAll('input').forEach(x=>{x.checked=(it.days||[]).includes(+x.value)})}else $('#da').value=view==='cal'?sel:ds(new Date());
sync();$('#dlg').showModal()}
$('#fab').onclick=()=>openF();$('#cx').onclick=()=>$('#dlg').close();
$('#f').onsubmit=()=>{const t=ty.value,w=t==='work'||t==='class',i={type:t,title:$('#ti').value.trim()||(w?T[t][0]:''),date:$('#da').value,notes:$('#no').value.trim()};if(!i.title||!i.date)return;
if($('#t1').value)i.time=$('#t1').value;if($('#t2').value)i.endTime=$('#t2').value;if(t==='birthday')i.repeat='yearly';
if(w){const d=[...wd.querySelectorAll('input:checked')].map(x=>+x.value);if(d.length){i.repeat='weekly';i.days=d;if($('#un').value)i.until=$('#un').value}}
if(eid!=null&&S.items[eid]){i.done=S.items[eid].done;S.items[eid]=i}else S.items.push(i);eid=null;save();render()};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
theme();render();loadFeed();if(AU)pull();document.addEventListener('visibilitychange',()=>{if(!document.hidden){loadFeed();if(AU)pull()}});
</script></body></html>
